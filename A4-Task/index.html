<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Portfolio Grid</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="portfolio-layout">

    <!-- LEFT PROFILE CARD -->

    <div class="card profile-card">

      <div class="about">
        About Me
      </div>

      <!-- IMAGE SECTION -->

      <div class="portrait-wrapper">

        <div class="circle-bg"></div>

        <img
          src="man1.png"
          alt="Profile"
          class="portrait"
        >

      </div>

      <!-- TEXT -->

      <div class="profile-content">

        <h2>
          I'm,<br>
          <span>Jon</span><br>
          <span>Daniel</span>
        </h2>

        <div class="email">
          inquiry@jondaniel.design
        </div>

      </div>

      <!-- BADGE -->

      <div class="badge">
        2025 <br>
        DESIGN <br>
        PORTFOLIO
      </div>

      <!-- SIDE NAV -->

      <div class="side-nav">
        <span>Clients</span>
        <span>Research</span>
        <span>Portfolio</span>
        <span>Podcast</span>
      </div>

    </div>

    <!-- TITLE -->

    <div class="title-area">

      <h1>Portfolio</h1>

    </div>

    <!-- FLAMINGO CARD -->

    <div class="card video-card">

      <img
        src="flamingo.jpg"
        alt="Flamingo"
      >

      <div class="play-btn"></div>

    </div>

    <!-- STATS COLUMN -->

    <div class="stats-column">

      <div class="card stat-card mint">

        <div class="corner">⌝</div>

        <h3>251</h3>

        <p>Projects</p>

      </div>

      <div class="card stat-card purple">

        <div class="corner">⌝</div>

        <h3>156</h3>

        <p>Awards</p>

      </div>

    </div>

    <!-- CLIENTS CARD -->

    <div class="card bottom-left">

      <div class="corner">⌝</div>

      <div class="apple"></div>

      <p>Clients</p>

    </div>

    <!-- ORB CARD -->

    <div class="card bottom-center">

      <img
        src="ball1.png"
        alt="Orb"
        class="orb-image"
      >

    </div>

    <!-- AWARDS CARD -->

    <div class="card bottom-right">

      <div class="corner">⌝</div>

      <h3>172</h3>

      <p>
        Global Design <br>
        Awards.
      </p>

    </div>

  </div>

</body>

</html>
